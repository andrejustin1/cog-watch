<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watch C.O.G. on Amazon</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0b0b0d;--ink:#f2f2f4;--muted:#a3a3ad;--accent:#ff9900;--line:#26262c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:420px;text-align:center}
h1{font-size:28px;letter-spacing:.04em;margin:0 0 4px}
p{color:var(--muted);margin:0 0 22px}
a.btn{display:block;width:100%;padding:16px;border-radius:12px;font-weight:700;text-decoration:none;margin-bottom:12px;border:1px solid var(--line);color:var(--ink)}
a.btn.primary{background:var(--accent);border-color:var(--accent);color:#111}
small{color:var(--muted);display:block;margin-top:8px}
</style>
<!-- Meta pixel (C.O.G. Pixel) so we can count who reaches this page and who taps through -->
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','1552562793581687');fbq('track','PageView');
</script>
</head>
<body>
<div class="card">
  <h1>C.O.G.</h1>
  <p>Opening Amazon…</p>
  <a class="btn primary" id="app" href="#">Open in the Prime Video app</a>
  <a class="btn" id="web" href="https://www.amazon.com/dp/B0HJ26Q1ZL">Continue on amazon.com</a>
  <small>Rent or buy C.O.G. on Amazon.</small>
</div>
<script>
(function () {
  var ASIN = 'B0HJ26Q1ZL';
  var WEB = 'https://www.amazon.com/dp/' + ASIN;
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var GTI = 'amzn1.dv.gti.f4adc189-d884-402c-9ea7-30e16227fc16';
  // Android: open C.O.G.'s page in the Prime Video app (tested on Android: lands on the movie's page).
  // If Prime Video isn't installed, Android falls back to Amazon's website.
  var ANDROID = 'intent://app.primevideo.com/detail?gti=' + GTI +
    '#Intent;scheme=https;package=com.amazon.avod.thirdpartyclient;S.browser_fallback_url=' +
    encodeURIComponent(WEB) + ';end';
  // iPhone: the Prime Video app's own link scheme. If the app isn't installed nothing happens,
  // so we fall back to Amazon's website after a short wait.
  var IOS = 'aiv://app.primevideo.com/detail?gti=' + GTI;
  var appLink = isAndroid ? ANDROID : isIOS ? IOS : WEB;
  document.getElementById('app').href = appLink;

  function track(name) { try { fbq('trackCustom', name, { platform: isAndroid ? 'android' : isIOS ? 'ios' : 'desktop' }); } catch (e) {} }
  document.getElementById('app').addEventListener('click', function () { track('OpenPrimeVideoApp'); });
  document.getElementById('web').addEventListener('click', function () { track('OpenAmazonWeb'); });

  if (!isAndroid && !isIOS) { location.replace(WEB); return; }
  if (/[?&]noauto/.test(location.search)) return;
  // Try the app automatically; if the page is still visible after 1.8s, the app didn't open, so go to the website.
  var left = false;
  document.addEventListener('visibilitychange', function () { if (document.hidden) left = true; });
  window.addEventListener('pagehide', function () { left = true; });
  track('AutoOpenPrimeVideoApp');
  location.href = appLink;
  setTimeout(function () { if (!left && !document.hidden) location.href = WEB; }, 1800);
})();
</script>
</body>
</html>
